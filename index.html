    <script>
      // Gracefully handle harmless Vite HMR WebSocket disconnects in iframe dev environments per AI Studio specifications
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) {
            return (a && typeof a === 'object') ? (a.message || a.stack || '') : String(a);
          }).join(' ');
          if (text.indexOf('WebSocket') !== -1 || text.indexOf('closed without opened') !== -1) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('closed without opened') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = (reason && reason.message) ? reason.message : String(reason);
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
